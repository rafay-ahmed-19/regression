services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  hub:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "8000:8000"
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: regression_hub
      SEED_DEMO: "true"
      # Optional: enables the "Analyse failure" panel.
      # Note: to reach Oracle over a VPN, the container must be able to route through it.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

volumes:
  mongo-data:
